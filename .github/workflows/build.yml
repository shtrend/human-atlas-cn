name: Build APK & IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: 获取上游源码并应用汉化补丁
        run: |
          git clone --depth 1 https://github.com/ashemag/human-atlas atlas
          cd atlas
          git apply --binary --whitespace=nowarn ../patch.diff
      - name: 构建 Web 产物并同步到 Android
        run: |
          cd atlas
          npm install --no-audit --no-fund
          npm run build
          npx cap sync android
      - name: 打包 debug APK（可直接安装）
        run: |
          cd atlas/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: human-atlas-android-apk
          path: atlas/android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 获取上游源码并应用汉化补丁
        run: |
          git clone --depth 1 https://github.com/ashemag/human-atlas atlas
          cd atlas
          git apply --binary --whitespace=nowarn ../patch.diff
      - name: 构建 Web 产物并同步到 iOS
        run: |
          cd atlas
          npm install --no-audit --no-fund
          npm run build
          npx cap sync ios
      - name: Xcode 打包未签名 IPA
        run: |
          cd atlas/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qry ../../human-atlas-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: human-atlas-ios-ipa
          path: atlas/human-atlas-ios-unsigned.ipa
